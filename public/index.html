<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link
      href="https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="/src/css/style.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://unpkg.com/vue-router@4"></script>
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app">
      <nav class="sidebar close">
        <header>
          <div class="image-text">
            <span class="image">
              <img src="/src/img/user_thumb.png" alt="" />
            </span>

            <div class="text logo-text">
              <span class="name">Username</span>
              <span class="profession">active</span>
            </div>
          </div>

          <i class="bx bx-chevron-right toggle"></i>
        </header>

        <div class="menu-bar">
          <div class="menu">
            <li class="search-box">
              <i class="bx bx-search icon"></i>
              <input type="text" placeholder="Search..." />
            </li>

            <ul class="menu-links">
              <li class="nav-link">
                <router-link to="/">
                  <i class="bx bx-home-alt icon"></i>
                  <span class="text nav-text"> Home </span>
                </router-link>
              </li>

              <li class="nav-link">
                <router-link to="/user">
                  <i class="bx bx-user icon"></i>
                  <span class="text nav-text">
                    <router-link to="/user">User</router-link>
                  </span>
                </router-link>
              </li>

              <li class="nav-link">
                <a href="#">
                  <i class="bx bx-chat icon"></i>
                  <span class="text nav-text">
                    <router-link to="/support">Talk to us</router-link>
                  </span>
                </a>
              </li>

              <li class="nav-link">
                <a href="#">
                  <i class="bx bx-pie-chart-alt-2 icon"></i>
                  <span class="text nav-text">Analytics</span>
                </a>
              </li>
              <li class="nav-link">
                <a href="#">
                  <i class="bx bx-cart-alt icon"></i>
                  <span class="text nav-text">Order</span>
                </a>
              </li>
              <li class="nav-link">
                <a href="#">
                  <i class="bx bx-heart icon"></i>
                  <span class="text nav-text">Saved</span>
                </a>
              </li>
              <li class="nav-link">
                <a href="#">
                  <i class="bx bx-cog icon"></i>
                  <span class="text nav-text">Config</span>
                </a>
              </li>
            </ul>
          </div>

          <div class="bottom-content">
            <li class="">
              <a href="#">
                <i class="bx bx-log-out icon"></i>
                <span class="text nav-text">Logout</span>
              </a>
            </li>

            <li class="mode">
              <div class="sun-moon">
                <i class="bx bx-moon icon moon"></i>
                <i class="bx bx-sun icon sun"></i>
              </div>
              <span class="mode-text text">Dark mode</span>

              <div class="toggle-switch">
                <span class="switch"></span>
              </div>
            </li>
          </div>
        </div>
      </nav>
      <section class="header-site" id="header-site">
        <div id="logo">
          <img src="/src/img/sugarbay-logo.png" alt=""  height="65px" />
        </div>
      </section>
    </div>
    
    <!-- built files will be auto injected -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
  </body>
</html>
